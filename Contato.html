<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <title>Bikcraft</title>
         <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <section>
            <div class="address-box"></div>
           <form>
            <!-- primeira caixa -->
            <div class="primary-box">
                <div>
                    <label>nome</label>
                    <input type="text" placeholder="Seu Nome" />
                </div>
                <div>
                    <label>telefone</label>
                    <input type="tel" placeholder="(xx) xxxxxx-xxxx" />
                </div>
                
            </div>
    
            <!-- segunda caixa -->
            <div class="secondary-box">
                <label>email</label>
                <input type="email" placeholder="Contato@gmail.com" />
            </div>
    
            <!-- terceira caixa -->
            <div class="third-box">
                <label>mensagem</label>
                <textarea placeholder="O que voce precisa?"></textarea>
            </div>
    
            <!-- Botao -->
            <button>enviar mensagem</button>
           </form>
        </section>
    </body>
</html>
