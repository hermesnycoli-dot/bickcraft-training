<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <title>Bikcraft</title>
         <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
       <form>
        <!-- primeira caixa -->
        <div class="primary-box">
            <div>
                <label>nome</label>
                <input type="text" placeholder="Seu Nome" />
            </div>
            <div>
                <label>telefone</label>
                <input type="tel" placeholder="(xx) xxxxxx-xxxx" />
            </div>
            
        </div>

        <!-- segunda caixa -->
        <div>
            <label>email</label>
            <input type="email" placeholder="contato@gmail.com" />
        </div>

        <!-- terceira caixa -->
        <div>
            <label>mensagem</label>
            <textarea placeholder="o que voce precisa?"></textarea>
        </div>

        <!-- Botao -->
        <button>enviar mensagem</button>
       </form>
    </body>
</html>
